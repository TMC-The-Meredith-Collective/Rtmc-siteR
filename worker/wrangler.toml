name            = "tmc-lead-intake"
main            = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ── KV namespace for rate limiting ────────────────────────────────────────────
# After running `wrangler kv:namespace create "RATE_LIMIT_KV"`, paste the id here
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id      = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ── Non-secret environment variables ─────────────────────────────────────────
[vars]
DATABRICKS_HOST        = "REPLACE_WITH_YOUR_DATABRICKS_HOST"   # e.g. adb-XXXX.XX.azuredatabricks.net
DATABRICKS_WAREHOUSE_ID = "REPLACE_WITH_YOUR_WAREHOUSE_ID"
ALLOWED_ORIGIN         = "https://tmcsolutions-org.net"

# ── DATABRICKS_TOKEN must be stored as a secret (never in wrangler.toml) ─────
# Run once: wrangler secret put DATABRICKS_TOKEN
# Then paste your Databricks Personal Access Token when prompted.
