# One Worker serves the whole site:
#   • ./public is served as static assets, asset-first: this script is NOT invoked for them.
#   • Requests matching no asset reach the script; only POST /api/submit does anything.
name               = "tmc-solutions-site"
main               = "worker/tmc-lead-intake-worker.js"
compatibility_date = "2026-09-30"

# No *.workers.dev hostname or preview URLs: the only public surface is the custom domains.
workers_dev  = false
preview_urls = false

# Custom domains: Wrangler creates the DNS records and certificates on deploy.
# Fails if either hostname already has a DNS record (see docs/DEPLOY-RUNBOOK.md, Phase 0).
routes = [
  { pattern = "tmcsolutions-org.net",     custom_domain = true },
  { pattern = "www.tmcsolutions-org.net", custom_domain = true }
]

[assets]
directory = "./public"

# Per-hashed-IP limit on /api/submit: 3 submissions / 60 s per Cloudflare location.
[[ratelimits]]
name         = "LEAD_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit  = 3
  period = 60

# Non-sensitive config only. NEVER put credentials here.
[vars]
ALLOWED_ORIGINS        = "https://tmcsolutions-org.net,https://www.tmcsolutions-org.net"
DATABRICKS_OAUTH_SCOPE = "all-apis"

# Set with `npx wrangler secret put <NAME>` (interactive, hidden input).
# `wrangler deploy` refuses to run while any of these is missing.
[secrets]
required = [
  "DATABRICKS_HOST",
  "DATABRICKS_WAREHOUSE_ID",
  "DATABRICKS_CLIENT_ID",
  "DATABRICKS_CLIENT_SECRET"
]

[observability]
enabled = true
